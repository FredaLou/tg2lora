source:
  format: telegram
  field: text
filters:
  min_len: 30
  max_len: 300
  rule_threshold: 0
  range:
    start: 0
    end: 10
  llm_judge:
    enabled: false
    url: http://127.0.0.1:8080/completion
    keep_score: 5
    max_results: 1000
generation:
  url: http://127.0.0.1:8080/completion
  temperature: 0.85
  max_tokens: 1024
  top_p: 0.9
  min_p: 0.05
  repeat_penalty: 1.1
  delay: 0.2
  stop:
  - </s>
  - 'User:'
  system_prompt: 'You are a helpful assistant.

      Be natural, concise, and direct.

      Speak in the same language as the user.

      /no_think'
output:
  format: conversations

